project:
  name: CR-ViT-Glioma-PFS
  random_seed: 2026
  device: auto

data:
  manifest: inputs/manifest.csv
  patient_id_column: patient_id
  subtype_column: subtype
  cohort_column: cohort
  training_cohort: training
  time_column: pfs_time_months
  event_column: event
  image_columns:
    T1WI: T1WI
    T2WI: T2WI
    T2_FLAIR: T2_FLAIR
    CE_T1WI: CE_T1WI
  mask_column: tumor_mask
  brain_mask_column: brain_mask

mri_preprocessing:
  reference_sequence: CE_T1WI
  orientation: LPS
  target_spacing_mm_xyz: [1.0, 1.0, 5.0]
  target_size_voxels_xyz: [192, 192, 24]
  registration:
    transform: rigid_euler_3d
    metric: mattes_mutual_information
    metric_bins: 50
    optimizer: gradient_descent
    learning_rate: 1.0
    iterations: 100
    shrink_factors: [4, 2, 1]
    smoothing_sigmas_mm: [2.0, 1.0, 0.0]
  n4_bias_correction:
    enabled: true
    iterations: [50, 50, 30, 20]
    convergence_threshold: 0.000001
    fitting_levels: 4
  intensity_normalization:
    method: brain_mask_z_score
    clip_after_normalization: [-5.0, 5.0]
  tumor_core_expansion_mm: 5.0
  image_interpolation: linear
  mask_interpolation: nearest

nnunet:
  dataset_id: 501
  dataset_name: GliomaTumorCore
  configuration: 3d_fullres
  trainer: nnUNetTrainer
  folds: [0, 1, 2, 3, 4]
  label_map:
    background: 0
    tumor_core: 1

survival_model:
  models: [3d_vit, 3d_resnet18]
  input_array_order: CZYX
  patch_size_xyz: [16, 16, 4]
  embed_dim: 256
  transformer_depth: 6
  attention_heads: 8
  mlp_ratio: 4.0
  dropout: 0.1
  survival_head_hidden_dim: 64
  survival_head_dropout: 0.3
  cnn_head_dropout: 0.3
  # Forward microbatch size; the Cox loss uses the complete fitting risk set.
  batch_size: 8
  cox_risk_set: full_cohort
  epochs: 200
  learning_rate: 0.0001
  weight_decay: 0.0001
  warmup_epochs: 10
  learning_rate_schedule: linear_warmup_cosine
  validation_fraction: 0.2
  validation_stratification: event_and_time_quartile
  early_stopping_patience: 30
  gradient_clip_norm: 1.0
  cox_tie_method: breslow
  augmentation:
    enabled: true
    rotation_degrees_xyz: [10.0, 10.0, 10.0]
    translation_voxels_xyz: [5.0, 5.0, 1.0]
    spatial_scale_range: [0.9, 1.1]
    intensity_scale_range: [0.9, 1.1]
    intensity_shift_max: 0.1
    noise_std_max: 0.05
    left_right_flip: false
  score_output_name: risk_score

attribution:
  methods: [occlusion]
  models: [3d_vit]
  occlusion_block_size_xyz: [16, 16, 4]
  occlusion_stride_xyz: [8, 8, 2]
  occlusion_fill_strategy: training_channel_mean
  visualization: absolute_magnitude
  save_case_maps: true

bulk_ssgsea:
  expression_orientation: genes_by_samples
  sample_id_column: sample_id
  group_column: risk_group
  min_genes_per_signature: 5
  permutation_count: 1000
  multiple_testing_method: benjamini_hochberg

single_cell:
  input_format: h5ad
  patient_id_column: patient_id
  risk_group_column: risk_group
  min_genes_per_cell: 200
  max_mitochondrial_percent: 20.0
  min_cells_per_gene: 3
  highly_variable_genes: 2000
  pca_components: 50
  neighbors: 15
  leiden_resolution: 0.5
  marker_test: wilcoxon
  state_score_method: mean_z_scored_markers
  ligand_receptor_score_method: geometric_mean_log_expression
  run_cnv_if_available: true
